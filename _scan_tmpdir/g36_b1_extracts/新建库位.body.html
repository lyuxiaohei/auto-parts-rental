<div class="modal-overlay" id="createModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">新建库位</h3>
      <span class="modal-close" onclick="closeModal('createModal')">×</span>
    </div>
    <div class="modal-body">
<div class="form-row">
    <span class="form-label">仓库名称</span>
    <div class="input-box"><input placeholder="自定义输入，如 上海一号仓 / 正品仓"></div>
  </div><div class="form-row">
    <span class="form-label"><span class="req">*</span>库位编码</span>
    <div class="input-box"><input placeholder="如 RA-A01"></div>
  </div><div class="form-row">
    <span class="form-label">库位类型</span>
    <div class="input-box select-box"><select id="locTypeSel" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font:inherit;color:inherit;cursor:pointer;padding:0;appearance:none;-webkit-appearance:none;"><option selected>存储位</option><option>拣选位</option><option>暂存位</option><option>不合格品位</option></select><span class="caret"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span></div>
  </div><div class="form-row">
    <span class="form-label">规格 / 承载</span>
    <div class="input-box"><input value="1200×1000 · ≤800kg" placeholder="请输入"></div>
  </div><div class="form-row">
    <span class="form-label">备注</span>
    <div class="input-box" style="height:72px;align-items:stretch;padding:6px 11px;">
      <textarea placeholder="选填" style="flex:1;min-width:0;height:100%;border:none;outline:none;background:transparent;font:inherit;color:inherit;resize:none;padding:0;line-height:1.6;"></textarea>
    </div>
  </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal('createModal')">取消</button>
      <button class="btn" onclick="closeModal('createModal')">保存</button>
    </div>
  </div>
</div>
