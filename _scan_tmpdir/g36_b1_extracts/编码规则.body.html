<div class="modal-overlay" id="ruleModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">项目编码规则</h3>
      <span class="modal-close" onclick="closeModal('ruleModal')">×</span>
    </div>
    <div class="modal-body">
  <div class="form-row" style="margin-bottom:14px;">
    <div class="form-label">编码结构：</div>
    <div class="form-tip" style="line-height:2;">前缀 <code>PRJ-</code> + 年份两位 <code>{YY}</code> + 连字符 + 流水四位 <code>{NNNN}</code></div>
  </div>
  <div class="form-row" style="margin-bottom:14px;">
    <div class="form-label"><span class="req">*</span>项目前缀：</div>
      <div class="input-box" style="width:220px;"><input type="text" value="PRJ-"></div>
  </div>
  <div class="form-row" style="margin-bottom:14px;">
    <div class="form-label"><span class="req">*</span>流水位数：</div>
      <div style="display:flex;">
        <span class="radio"><span class="dot"></span>2 位</span>
        <span class="radio"><span class="dot"></span>3 位</span>
        <span class="radio checked"><span class="dot"></span>4 位</span>
      </div>
  </div>
  <div class="form-row" style="margin-bottom:14px;">
    <div class="form-label">是否连续：</div>
      <div style="display:flex;">
        <span class="radio checked"><span class="dot"></span>连续流水（推荐）</span>
        <span class="radio"><span class="dot"></span>按年份独立</span>
      </div>
  </div>
  <div class="form-row" style="margin-bottom:0;">
    <div class="form-label">预览示例：</div>
    <div class="form-tip">下一个项目编码：<code>PRJ-2606</code>（自动生成、不可编辑，与库存/单据编码规则一致）</div>
  </div>
    </div>
    <div class="modal-footer">
<button class="btn btn-default" onclick="closeModal('ruleModal')">取 消</button><button class="btn" onclick="closeModal('ruleModal')">保存规则</button>
    </div>
  </div>
</div>
