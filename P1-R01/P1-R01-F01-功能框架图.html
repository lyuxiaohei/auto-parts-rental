<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1-R01-F01 功能框架图</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--paper:#fafafa;--paper2:#f0f2f5;--ink:#111827;--muted:#4b5563;--soft:#6b7280;
--rule:rgba(17,24,39,0.10);--ruleSolid:#d1d5db;--accent:#2563eb;--accentTint:rgba(37,99,235,0.08);
--sans:'Geist','Microsoft YaHei',system-ui,sans-serif;
--serif:'Instrument Serif','SimSun',serif;
--mono:'Geist Mono',Consolas,ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw+.75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;min-width:900px;display:block}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">P1-R01-F01 · Layer Stack · 功能框架</p>
  <h1>自研包装租赁系统功能框架</h1>

  <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#fafafa"/>

    <!-- 左侧依赖方向指示 -->
    <line x1="76" y1="552" x2="76" y2="64" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="76" y="576" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">依赖方向</text>

    <!-- L3 经营分析层 -->
    <rect x="120" y="40" width="840" height="112" rx="8" fill="#f0f2f5" stroke="rgba(17,24,39,0.10)" stroke-width="1"/>
    <text x="140" y="68" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" letter-spacing="0.14em">L3 · 经营分析层 MANAGEMENT</text>
    <text x="940" y="68" fill="#6b7280" font-size="9" font-family="'Geist Mono',Consolas,monospace" text-anchor="end">项目维度盈亏 · 营收 · 出入</text>
    <rect x="380" y="88" width="240" height="48" rx="6" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.2"/>
    <text x="500" y="109" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">项目管理中心</text>
    <text x="500" y="125" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">项目编码 · 上下游绑定 · 看板</text>

    <!-- L2 业务执行层 -->
    <rect x="120" y="184" width="840" height="128" rx="8" fill="#f0f2f5" stroke="rgba(17,24,39,0.10)" stroke-width="1"/>
    <text x="140" y="212" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" letter-spacing="0.14em">L2 · 业务执行层 EXECUTION</text>
    <text x="940" y="212" fill="#6b7280" font-size="9" font-family="'Geist Mono',Consolas,monospace" text-anchor="end">核心租赁循环</text>

    <rect x="144" y="232" width="180" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="234" y="254" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">仓储作业</text>
    <text x="234" y="270" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">入库 · 小组装(新) · 出库</text>
    <text x="234" y="282" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">退租 · 盘点 · 双视角库存</text>

    <rect x="348" y="232" width="180" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="438" y="254" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">租赁管理</text>
    <text x="438" y="270" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">租出台账 · 在租跟踪</text>
    <text x="438" y="282" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">循环状态 · 缺损记录</text>

    <rect x="552" y="232" width="180" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="642" y="254" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">订单协同</text>
    <text x="642" y="270" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">客户下单入口 · 审核</text>
    <text x="642" y="282" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">路凯订单与结算导出</text>

    <rect x="756" y="232" width="180" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="846" y="254" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">财务协同</text>
    <text x="846" y="270" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">应收 · 开票 · 回款</text>
    <text x="846" y="282" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">银行水单核销</text>

    <!-- L1 支撑层 -->
    <rect x="120" y="352" width="840" height="112" rx="8" fill="#f0f2f5" stroke="rgba(17,24,39,0.10)" stroke-width="1"/>
    <text x="140" y="380" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" letter-spacing="0.14em">L1 · 数据与系统支撑 SUPPORT</text>
    <text x="940" y="380" fill="#6b7280" font-size="9" font-family="'Geist Mono',Consolas,monospace" text-anchor="end">全模块复用</text>

    <rect x="248" y="400" width="280" height="48" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="388" y="421" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">基础数据</text>
    <text x="388" y="437" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">项目 · 往来单位 · 零部件 · BOM · 库位</text>

    <rect x="552" y="400" width="280" height="48" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="692" y="421" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">系统管理</text>
    <text x="692" y="437" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">组织权限 · 操作日志 · 数据字典</text>

    <!-- 外部触点 -->
    <rect x="120" y="496" width="840" height="64" rx="8" fill="rgba(17,24,39,0.03)" stroke="rgba(17,24,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="140" y="524" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace" letter-spacing="0.14em">外部触点 EXTERNAL</text>

    <rect x="336" y="508" width="180" height="40" rx="6" fill="rgba(17,24,39,0.03)" stroke="rgba(17,24,39,0.30)" stroke-width="1"/>
    <text x="426" y="524" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">客户</text>
    <text x="426" y="538" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">下单 · 付款</text>

    <rect x="564" y="508" width="180" height="40" rx="6" fill="rgba(17,24,39,0.03)" stroke="rgba(17,24,39,0.30)" stroke-width="1"/>
    <text x="654" y="524" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">路凯</text>
    <text x="654" y="538" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">订单接收 · 结算 · 资产方</text>
  </svg>
</div>
</body>
</html>
