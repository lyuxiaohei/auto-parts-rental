<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1-R01-F02 包装租赁主循环流程图</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--paper:#fafafa;--paper2:#f0f2f5;--ink:#111827;--muted:#4b5563;--soft:#6b7280;
--rule:rgba(17,24,39,0.10);--ruleSolid:#d1d5db;--accent:#2563eb;--accentTint:rgba(37,99,235,0.08);
--sans:'Geist','Microsoft YaHei',system-ui,sans-serif;
--serif:'Instrument Serif','SimSun',serif;
--mono:'Geist Mono',Consolas,ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw+.75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;min-width:900px;display:block}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">P1-R01-F02 · Flowchart · 租赁主循环</p>
  <h1>包装租赁主循环流程</h1>

  <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#fafafa"/>

    <!-- 箭头（先画线后画框） -->
    <line x1="500" y1="96"  x2="500" y2="144" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="500" y1="208" x2="500" y2="256" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="500" y1="320" x2="500" y2="368" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="500" y1="432" x2="500" y2="480" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <!-- 循环回环：退租验收 → 组合出库 -->
    <polyline points="620,512 760,512 760,288 620,288" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="776" y="392" width="96" height="16" rx="2" fill="#fafafa"/>
    <text x="824" y="403" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">循环再出库</text>

    <!-- 起点：配件到货入库（椭圆） -->
    <rect x="380" y="48" width="240" height="48" rx="24" fill="rgba(75,85,99,0.10)" stroke="#6b7280" stroke-width="1"/>
    <text x="500" y="68" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">配件到货入库</text>
    <text x="500" y="84" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">按零配件 · 以托为单位</text>

    <!-- 小组装（焦点·新增） -->
    <rect x="380" y="144" width="240" height="64" rx="6" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="388" y="152" width="32" height="12" rx="2" fill="transparent" stroke="rgba(37,99,235,0.40)" stroke-width="0.8"/>
    <text x="404" y="161" fill="rgba(37,99,235,0.80)" font-size="7" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">新增</text>
    <text x="500" y="174" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">小组装 A+B→C</text>
    <text x="500" y="192" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">运营方执行 · 记录时间与数量</text>

    <!-- 组合出库 -->
    <rect x="380" y="256" width="240" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="500" y="282" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">组合出库</text>
    <text x="500" y="300" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">按组合件 · 一箱一件</text>

    <!-- 客户使用 -->
    <rect x="380" y="368" width="240" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="500" y="394" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">客户使用</text>
    <text x="500" y="412" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">生产线上线 · 计划每天下达</text>

    <!-- 退租验收 -->
    <rect x="380" y="480" width="240" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="500" y="506" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">退租验收</text>
    <text x="500" y="524" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">回收入库 · 按零件核对缺损</text>

    <!-- 图例 -->
    <line x1="48" y1="576" x2="952" y2="576" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
    <text x="48" y="596" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="120" y="586" width="16" height="12" rx="2" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1"/>
    <text x="144" y="596" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">新增管理节点</text>
    <rect x="260" y="586" width="16" height="12" rx="6" fill="rgba(75,85,99,0.10)" stroke="#6b7280" stroke-width="1"/>
    <text x="284" y="596" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">起点</text>
    <rect x="360" y="586" width="16" height="12" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="384" y="596" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">业务步骤</text>
    <line x1="520" y1="592" x2="560" y2="592" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="568" y="596" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">租赁循环</text>
  </svg>
</div>
</body>
</html>
