<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1-R01-F03 财务闭环流程图</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--paper:#fafafa;--paper2:#f0f2f5;--ink:#111827;--muted:#4b5563;--soft:#6b7280;
--rule:rgba(17,24,39,0.10);--ruleSolid:#d1d5db;--accent:#2563eb;--accentTint:rgba(37,99,235,0.08);
--sans:'Geist','Microsoft YaHei',system-ui,sans-serif;
--serif:'Instrument Serif','SimSun',serif;
--mono:'Geist Mono',Consolas,ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw+.75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;min-width:900px;display:block}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">P1-R01-F03 · Flowchart · 财务闭环</p>
  <h1>财务闭环流程</h1>

  <svg viewBox="0 0 1000 736" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#fafafa"/>

    <!-- 箭头 -->
    <line x1="500" y1="104" x2="500" y2="160" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="500" y1="216" x2="500" y2="272" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="500" y1="328" x2="500" y2="384" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="500" y1="440" x2="500" y2="496" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="500" y1="552" x2="500" y2="608" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 出入库单据（数据源·store 样式） -->
    <rect x="380" y="48" width="240" height="56" rx="6" fill="rgba(17,24,39,0.05)" stroke="#4b5563" stroke-width="1"/>
    <text x="500" y="72" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">出入库单据</text>
    <text x="500" y="90" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">系统自动归集 · 按项目</text>

    <!-- 应收账单生成 -->
    <rect x="380" y="160" width="240" height="56" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="500" y="184" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">应收账单生成</text>
    <text x="500" y="202" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">按项目 / 客户归集</text>

    <!-- 开票登记 -->
    <rect x="380" y="272" width="240" height="56" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="500" y="296" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">开票登记</text>
    <text x="500" y="314" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">同步财务开票</text>

    <!-- 客户回款 -->
    <rect x="380" y="384" width="240" height="56" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="500" y="408" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">客户回款</text>
    <text x="500" y="426" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">银行到账</text>

    <!-- 银行水单核销（焦点·现状缺失） -->
    <rect x="380" y="496" width="240" height="56" rx="6" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.2"/>
    <rect x="388" y="504" width="48" height="12" rx="2" fill="transparent" stroke="rgba(37,99,235,0.40)" stroke-width="0.8"/>
    <text x="412" y="513" fill="rgba(37,99,235,0.80)" font-size="7" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle" letter-spacing="0.08em">现状缺失</text>
    <text x="500" y="526" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">银行水单核销</text>
    <text x="500" y="544" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">水单 ↔ 单据逐笔勾对</text>

    <!-- 项目维度盈亏（终点·椭圆） -->
    <rect x="380" y="608" width="240" height="48" rx="24" fill="rgba(75,85,99,0.10)" stroke="#6b7280" stroke-width="1"/>
    <text x="500" y="628" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">项目维度盈亏</text>
    <text x="500" y="644" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">营收 · 盈利分析</text>

    <!-- 图例 -->
    <line x1="48" y1="672" x2="952" y2="672" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
    <text x="48" y="692" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="120" y="682" width="16" height="12" rx="2" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1"/>
    <text x="144" y="692" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">现状缺失 · 本期补齐</text>
    <rect x="320" y="682" width="16" height="12" rx="2" fill="rgba(17,24,39,0.05)" stroke="#4b5563" stroke-width="1"/>
    <text x="344" y="692" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">数据源</text>
    <rect x="420" y="682" width="16" height="12" rx="6" fill="rgba(75,85,99,0.10)" stroke="#6b7280" stroke-width="1"/>
    <text x="444" y="692" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">终点</text>
    <rect x="520" y="682" width="16" height="12" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="544" y="692" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">业务步骤</text>
  </svg>
</div>
</body>
</html>
