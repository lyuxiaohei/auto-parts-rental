<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P1-R01-F04 客户下单与路凯协同图</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--paper:#fafafa;--paper2:#f0f2f5;--ink:#111827;--muted:#4b5563;--soft:#6b7280;
--rule:rgba(17,24,39,0.10);--ruleSolid:#d1d5db;--accent:#2563eb;--accentTint:rgba(37,99,235,0.08);
--sans:'Geist','Microsoft YaHei',system-ui,sans-serif;
--serif:'Instrument Serif','SimSun',serif;
--mono:'Geist Mono',Consolas,ui-monospace,monospace;
}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw+.75rem,2rem);font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;min-width:900px;display:block}
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">P1-R01-F04 · Swimlane × 2 · 路凯协同</p>
  <h1>客户下单与路凯协同（现状 / 目标）</h1>

  <svg viewBox="0 0 1000 704" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5563"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
    </defs>

    <rect width="100%" height="100%" fill="#fafafa"/>

    <!-- ══════════ 面板一：现状 AS-IS ══════════ -->
    <text x="24" y="60" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif">① 现状 · AS-IS</text>
    <text x="180" y="60" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace" letter-spacing="0.06em">三方运作 · 全部发生在路凯系统 · 待替换</text>

    <!-- 泳道底板 -->
    <rect x="104" y="80" width="856" height="240" fill="#ffffff" stroke="rgba(17,24,39,0.10)" stroke-width="1"/>
    <line x1="104" y1="160" x2="960" y2="160" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
    <line x1="104" y1="240" x2="960" y2="240" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>

    <text x="24" y="116" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif">客户</text>
    <text x="24" y="196" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif">我方</text>
    <text x="24" y="276" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif">路凯</text>

    <!-- 路凯系统包裹框（三方都被框进路凯系统） -->
    <rect x="116" y="92" width="692" height="228" rx="8" fill="none" stroke="rgba(17,24,39,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="796" y="106" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="end" letter-spacing="0.08em">路凯系统</text>

    <!-- 箭头（虚线=现状，待替换） -->
    <polyline points="228,152 228,206 360,206" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <polyline points="460,232 460,286 592,286" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- 步骤（虚线框=待替换） -->
    <rect x="128" y="100" width="200" height="52" rx="6" fill="rgba(17,24,39,0.02)" stroke="rgba(17,24,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="228" y="122" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">在路凯系统下单</text>
    <text x="228" y="138" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">客户直接操作供方系统</text>

    <rect x="360" y="180" width="200" height="52" rx="6" fill="rgba(17,24,39,0.02)" stroke="rgba(17,24,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="460" y="202" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">在路凯系统审核</text>
    <text x="460" y="218" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">审核客户单据</text>

    <rect x="592" y="260" width="200" height="52" rx="6" fill="rgba(17,24,39,0.02)" stroke="rgba(17,24,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="692" y="282" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">运营执行</text>
    <text x="692" y="298" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">路凯方做运营动作</text>

    <!-- ══════════ 分隔 ══════════ -->
    <line x1="24" y1="348" x2="960" y2="348" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>

    <!-- ══════════ 面板二：目标 TO-BE ══════════ -->
    <text x="24" y="380" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif">② 目标 · TO-BE</text>
    <text x="160" y="380" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace" letter-spacing="0.06em">我方系统承接下单与执行 · 路凯仅保留数据对接</text>

    <!-- 泳道底板 -->
    <rect x="104" y="392" width="856" height="240" fill="#ffffff" stroke="rgba(17,24,39,0.10)" stroke-width="1"/>
    <line x1="104" y1="472" x2="960" y2="472" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
    <line x1="104" y1="552" x2="960" y2="552" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>

    <text x="24" y="428" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif">客户</text>
    <text x="24" y="508" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif">我方</text>
    <text x="24" y="588" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif">路凯</text>

    <!-- 我方自研系统包裹框（焦点） -->
    <rect x="116" y="404" width="772" height="156" rx="8" fill="rgba(37,99,235,0.04)" stroke="rgba(37,99,235,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="876" y="418" fill="rgba(37,99,235,0.80)" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="end" letter-spacing="0.08em">我方自研系统</text>

    <!-- 箭头 -->
    <polyline points="214,448 214,502 320,502" fill="none" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="492" y1="502" x2="512" y2="502" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="684" y1="502" x2="704" y2="502" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="790" y1="528" x2="790" y2="556" stroke="#4b5563" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <rect x="716" y="532" width="148" height="16" rx="2" fill="#fafafa"/>
    <text x="790" y="543" fill="#7a8399" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">订单+结算数据·待定</text>

    <!-- B1 系统下单（焦点·新增能力） -->
    <rect x="128" y="416" width="172" height="32" rx="6" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.2"/>
    <text x="214" y="436" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">在我方系统下单</text>

    <!-- B2 订单审核 -->
    <rect x="320" y="476" width="172" height="52" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="406" y="498" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">订单审核</text>
    <text x="406" y="514" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">我方审核单据</text>

    <!-- B3 出入库执行 -->
    <rect x="512" y="476" width="172" height="52" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="598" y="498" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">出入库执行</text>
    <text x="598" y="514" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">仓储作业 · 小组装</text>

    <!-- B4 订单/结算传递 -->
    <rect x="704" y="476" width="172" height="52" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="790" y="498" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">订单/结算传递</text>
    <text x="790" y="514" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">对接方式待定</text>

    <!-- 路凯系统（store 样式，在包裹框之外） -->
    <rect x="640" y="576" width="280" height="52" rx="6" fill="rgba(17,24,39,0.05)" stroke="#4b5563" stroke-width="1"/>
    <text x="780" y="598" fill="#111827" font-size="12" font-weight="600" font-family="'Geist','Microsoft YaHei',sans-serif" text-anchor="middle">路凯系统</text>
    <text x="780" y="614" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" text-anchor="middle">运营执行 · 资产方 · 结算</text>

    <!-- 图例 -->
    <line x1="48" y1="656" x2="952" y2="656" stroke="rgba(17,24,39,0.10)" stroke-width="0.8"/>
    <text x="48" y="676" fill="#4b5563" font-size="8" font-family="'Geist Mono',Consolas,monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="120" y="666" width="16" height="12" rx="2" fill="rgba(17,24,39,0.02)" stroke="rgba(17,24,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="144" y="676" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">现状流程（待替换）</text>
    <rect x="300" y="666" width="16" height="12" rx="2" fill="#ffffff" stroke="#111827" stroke-width="1"/>
    <text x="324" y="676" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">目标流程</text>
    <rect x="420" y="666" width="16" height="12" rx="2" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1"/>
    <text x="444" y="676" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">新增能力</text>
    <line x1="560" y1="672" x2="596" y2="672" stroke="#4b5563" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="604" y="676" fill="#6b7280" font-size="8" font-family="'Geist Mono',Consolas,monospace">数据对接</text>
  </svg>
</div>
</body>
</html>
