<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>P3-R01-M03 · 审批详情</title>
<link rel="stylesheet" href="_m.css">
</head>
<body>
<div class="m-page" id="m-app">

  <div class="m-header" style="display:flex;align-items:center;gap:10px;">
    <span class="m-hd-back" onclick="go('待办审批.html')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
    <div>
      <div class="m-hd-title">审批详情</div>
      <div class="m-hd-sub" id="m-hd-doc">—</div>
    </div>
  </div>

  <div class="m-body" id="m-body">
    <div class="m-card">
      <div class="m-sec-title">单据摘要</div>
      <div id="m-summary"></div>
    </div>
    <div class="m-card">
      <div class="m-sec-title">单据明细（演示数据）</div>
      <div id="m-details"></div>
    </div>
    <div class="m-card" style="font-size:12px;color:#8c8c8c;line-height:1.8;">
      审批说明：通过后单据进入下一环节并通知提交人；驳回后退回提交人修改后重新提交。移动端为演示形态，明细为静态示例。
    </div>
  </div>

  <div class="m-action-bar" id="m-actions">
    <button class="m-btn m-btn-danger" id="m-btn-reject">驳 回</button>
    <button class="m-btn m-btn-primary" id="m-btn-pass">通 过</button>
  </div>

</div>
<script src="../_data/demo-data.js"></script>
<script src="_m.js"></script>
<script>
/* ---- 审批详情：todoItems 行摘要 + 静态演示明细 + 驳回/通过 ---- */
(function () {
  var id = '';
  try { id = new URLSearchParams(location.search).get('id') || ''; } catch (e) {}

  var hit = null;
  mRows('todoItems').forEach(function (r) { if (r.id === id) hit = r; });

  if (!hit) {   // 无效单号：空态，隐藏操作栏
    document.getElementById('m-summary').innerHTML = '<div class="m-empty">未找到该待办单据<br>可能已处理或链接失效</div>';
    document.getElementById('m-details').innerHTML = '';
    document.getElementById('m-actions').style.display = 'none';
    mGuard();
    return;
  }

  var f = hit.row.fields;
  document.getElementById('m-hd-doc').textContent = f.docNo;

  var done = mDoneMap();
  var cur = done[f.docNo] || f.action;   // 本机已审结果优先回显

  function badgeHtml(act) {
    return '<span class="m-badge ' + mBadgeCls(act) + '" id="m-status-badge">' + mEsc(act) + '</span>';
  }
  document.getElementById('m-summary').innerHTML =
    '<div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">'
    + '<span class="m-badge ' + mTypeCls(f.type) + '">' + mEsc(f.type) + '</span>' + badgeHtml(cur) + '</div>'
    + '<div class="m-dl"><div class="m-dt">单号</div><div class="m-dd">' + mEsc(f.docNo) + '</div></div>'
    + '<div class="m-dl"><div class="m-dt">摘要</div><div class="m-dd">' + mEsc(f.summary) + '</div></div>'
    + '<div class="m-dl"><div class="m-dt">所属项目</div><div class="m-dd">' + mEsc(f.project) + '</div></div>'
    + '<div class="m-dl"><div class="m-dt">提交人</div><div class="m-dd">' + mEsc(f.submitter) + '</div></div>'
    + '<div class="m-dl"><div class="m-dt">审核人</div><div class="m-dd">' + mEsc(f.auditor) + '</div></div>'
    + '<div class="m-dl"><div class="m-dt">提交时间</div><div class="m-dd">2026-' + mEsc(f.time) + '</div></div>';

  /* 明细行：尝试从摘要解析首个品目，其余为静态演示行 */
  var m = String(f.summary || '').match(/([\u4e00-\u9fa5A-Za-z0-9×\-（）()·]{2,20}?)\s*(\d[\d,]*)\s*(套|只|个|件|张)/);
  var rows = [];
  if (m) rows.push({ n: m[1] + '（摘要解析）', q: m[2], u: m[3], p: '340.00' });
  rows.push({ n: '围板箱 1200×1000×970', q: '160', u: '套', p: '340.00' });
  rows.push({ n: '塑料托盘 1200×1000', q: '120', u: '只', p: '95.00' });
  document.getElementById('m-details').innerHTML = rows.map(function (r) {
    return '<div class="m-detail-row"><div class="m-dr-name">' + mEsc(r.n) + '<small>含税单价 ' + r.p + ' 元</small></div>'
      + '<div class="m-dr-num"><b>' + r.q + '</b> ' + r.u + '</div></div>';
  }).join('');

  var btnPass = document.getElementById('m-btn-pass');
  var btnRej = document.getElementById('m-btn-reject');
  if (cur === '已通过' || cur === '已驳回') { btnPass.disabled = true; btnRej.disabled = true; }

  function act(result, toastMsg) {
    mDoneSet(f.docNo, result);
    var b = document.getElementById('m-status-badge');
    b.textContent = result;                                   // DOM 副作用：状态徽标变化
    b.className = 'm-badge ' + mBadgeCls(result);
    btnPass.disabled = true; btnRej.disabled = true;
    mToast(toastMsg);
    setTimeout(function () { go('待办审批.html'); }, 900);
  }
  btnPass.onclick = function () { act('已通过', '已通过 · 单据进入下一环节，已通知提交人 ' + f.submitter); };
  btnRej.onclick = function () { act('已驳回', '已驳回 · 单据退回 ' + f.submitter + ' 修改后重新提交'); };

  mGuard();   // 免二次登录守卫
})();
</script>
</body>
</html>
