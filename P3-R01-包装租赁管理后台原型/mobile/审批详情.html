<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>P3-R01-M03 · 审批详情</title>
<link rel="stylesheet" href="_m.css">
</head>
<body>
<div class="m-page" id="m-app">

  <div class="m-header" style="display:flex;align-items:center;gap:10px;">
    <span class="m-hd-back" onclick="go('待办审批.html')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></span>
    <div>
      <div class="m-hd-title">审批详情</div>
      <div class="m-hd-sub" id="m-hd-doc">—</div>
    </div>
  </div>

  <div class="m-body" id="m-body">
    <div class="m-card">
      <div class="m-sec-title" data-note="2">单据摘要</div>
      <div id="m-summary"></div>
    </div>
    <div class="m-card">
      <div class="m-sec-title" data-note="1">单据明细</div>
      <div id="m-details"></div>
    </div>
  </div>

  <div class="m-action-bar" id="m-actions">
    <button class="m-btn m-btn-danger" id="m-btn-reject">驳 回</button>
    <button class="m-btn m-btn-primary" id="m-btn-pass">通 过</button>
  </div>

</div>
<script src="../_data/demo-data.js"></script>
<script src="_m.js"></script>
<script>
/* ---- 审批详情：todoItems 行摘要 + 静态演示明细 + 驳回/通过 ---- */
(function () {
  var id = '';
  try { id = new URLSearchParams(location.search).get('id') || ''; } catch (e) {}

  var hit = null;
  mRows('todoItems').forEach(function (r) { if (r.id === id) hit = r; });

  if (!hit) {   // 无效单号：空态，隐藏操作栏
    document.getElementById('m-summary').innerHTML = '<div class="m-empty">未找到该待办单据<br>可能已处理或链接失效</div>';
    document.getElementById('m-details').innerHTML = '';
    document.getElementById('m-actions').style.display = 'none';
    mGuard();
    return;
  }

  var f = hit.row.fields;
  document.getElementById('m-hd-doc').textContent = f.docNo;

  var done = mDoneMap();
  var cur = done[f.docNo] || f.action;   // 本机已审结果优先回显

  function badgeHtml(act) {
    return '<span class="m-badge ' + mBadgeCls(act) + '" id="m-status-badge">' + mEsc(act) + '</span>';
  }
  document.getElementById('m-summary').innerHTML =
    '<div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">'
    + '<span class="m-badge ' + mTypeCls(f.type) + '">' + mEsc(f.type) + '</span>' + badgeHtml(cur) + '</div>'
    + '<div class="m-dl"><div class="m-dt">单号</div><div class="m-dd">' + mEsc(f.docNo) + '</div></div>'
    + '<div class="m-dl"><div class="m-dt">摘要</div><div class="m-dd">' + mEsc(f.summary) + '</div></div>'
    + '<div class="m-dl"><div class="m-dt">所属项目</div><div class="m-dd">' + mEsc(f.project) + '</div></div>'
    + '<div class="m-dl"><div class="m-dt">提交人</div><div class="m-dd">' + mEsc(f.submitter) + '</div></div>'
    + '<div class="m-dl"><div class="m-dt">审核人</div><div class="m-dd">' + mEsc(f.auditor) + '</div></div>'
    + '<div class="m-dl"><div class="m-dt">提交时间</div><div class="m-dd">2026-' + mEsc(f.time) + '</div></div>';

  /* 明细行：尝试从摘要解析首个品目，其余为静态演示行 */
  var m = String(f.summary || '').match(/([\u4e00-\u9fa5A-Za-z0-9×\-（）()·]{2,20}?)\s*(\d[\d,]*)\s*(套|只|个|件|张)/);
  var rows = [];
  if (m) rows.push({ n: m[1] + '（摘要解析）', q: m[2], u: m[3], p: '340.00' });
  rows.push({ n: '围板箱 1200×1000×970', q: '160', u: '套', p: '340.00' });
  rows.push({ n: '塑料托盘 1200×1000', q: '120', u: '只', p: '95.00' });
  document.getElementById('m-details').innerHTML = rows.map(function (r) {
    return '<div class="m-detail-row"><div class="m-dr-name">' + mEsc(r.n) + '<small>含税单价 ' + r.p + ' 元</small></div>'
      + '<div class="m-dr-num"><b>' + r.q + '</b> ' + r.u + '</div></div>';
  }).join('');

  var btnPass = document.getElementById('m-btn-pass');
  var btnRej = document.getElementById('m-btn-reject');
  if (cur === '已通过' || cur === '已驳回') { btnPass.disabled = true; btnRej.disabled = true; }

  function act(result, toastMsg) {
    mDoneSet(f.docNo, result);
    var b = document.getElementById('m-status-badge');
    b.textContent = result;                                   // DOM 副作用：状态徽标变化
    b.className = 'm-badge ' + mBadgeCls(result);
    btnPass.disabled = true; btnRej.disabled = true;
    mToast(toastMsg);
    setTimeout(function () { go('待办审批.html'); }, 900);
  }
  btnPass.onclick = function () { act('已通过', '已通过 · 单据进入下一环节，已通知提交人 ' + f.submitter); };
  btnRej.onclick = function () { act('已驳回', '已驳回 · 单据退回 ' + f.submitter + ' 修改后重新提交'); };

  mGuard();   // 免二次登录守卫
})();
</script>









<style id="proto-notes-style">
body.proto-notes-on [data-note]{position:relative}
body.proto-notes-on [data-note]::after{content:attr(data-note);position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 3px;border-radius:3px;background:#722ed1;color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600;box-shadow:0 0 0 1.5px #fff;cursor:pointer;opacity:.75;transition:opacity .15s}
body.proto-notes-on [data-note]:hover::after{opacity:1}
@keyframes pn-blink{0%{box-shadow:0 0 0 2px #722ed1}25%{box-shadow:0 0 0 5px rgba(114,46,209,.35)}100%{box-shadow:0 0 0 2px transparent}}
.proto-pin{display:none;position:absolute;width:300px;background:#fff;border:1px solid #f0f0f0;border-top:2px solid #722ed1;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.13);z-index:890;padding:10px 12px;font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;font-size:12px;color:#262626}
body.proto-notes-on .proto-pin.pn-open{display:block}
.proto-pin .pnp-close{position:absolute;top:6px;right:8px;cursor:pointer;color:#8c8c8c;font-size:14px;line-height:1;padding:2px}
.proto-pin .pnp-close:hover{color:#262626}
.proto-pin .pnp-t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:#262626;padding-right:16px}
.proto-pin .pnp-n{flex:none;min-width:16px;height:16px;padding:0 3px;border-radius:3px;background:#722ed1;color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600}
.proto-pin .pnp-d{margin-top:5px;color:#595959;line-height:1.6}
.proto-pin .pnp-b{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.proto-pin .pnp-tag{background:#f9f0ff;color:#722ed1;border-radius:3px;padding:0 6px;font-size:11px;line-height:20px}
.proto-pin .pnp-src{margin-top:8px;padding-top:7px;border-top:1px dashed #e5dff0;font-size:11px;color:#595959;line-height:1.65}
.proto-pin .pnp-src b{color:#722ed1;font-weight:600}
.pn-fab{position:fixed;right:12px;bottom:12px;z-index:880;display:flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:4px;background:#fff;border:1px solid #ddd0ec;color:#722ed1;font-size:11px;font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);opacity:.6;transition:opacity .15s}
.pn-fab:hover{opacity:1;border-color:#722ed1}
body.proto-notes-on .pn-fab{background:#f9f0ff;border-color:#722ed1;opacity:.95}
.pn-fab .pn-fab-n{font-family:Consolas,monospace;font-weight:600}
</style>
<div id="proto-pins"><div class="proto-pin" id="proto-pin-1"><span class="pnp-close">×</span><div class="pnp-t"><span class="pnp-n">1</span>明细=静态演示数据</div><div class="pnp-d">单据明细为静态示例（演示数据），演示移动端审批详情形态。</div></div>
<div class="proto-pin" id="proto-pin-2"><span class="pnp-close">×</span><div class="pnp-t"><span class="pnp-n">2</span>审批动作口径</div><div class="pnp-d">通过后单据进入下一环节并通知提交人；驳回后退回提交人修改后重新提交。移动端为演示形态。</div></div>
<div class="pn-fab" id="protoNotesFab">标注</div></div>
<script id="proto-notes-js">
(function(){
  var KEY='proto-notes-on';
  function on(){return location.search.indexOf('notes=1')>-1||localStorage.getItem(KEY)==='1'}
  function apply(){
    document.body.classList.toggle('proto-notes-on',on());
    var fab=document.getElementById('protoNotesFab');
    if(fab){fab.innerHTML=on()?'收起':'标注 <span class="pn-fab-n">'+(document.querySelectorAll('[data-note]').length)+'</span>';fab.title=on()?'收起标注（Alt+N）':'显示标注（Alt+N）'}
  }
  function toggle(){var v=!on();localStorage.setItem(KEY,v?'1':'0');apply()}
  document.addEventListener('keydown',function(e){if(e.altKey&&(e.key==='n'||e.key==='N')){e.preventDefault();toggle()}});
  function place(el,pin){
    var r=el.getBoundingClientRect(),sx=window.scrollX||0,sy=window.scrollY||0;
    var w=pin.offsetWidth||248,h=pin.offsetHeight||90,vw=document.documentElement.clientWidth;
    var x=r.right+sx+12;
    if(x+w>sx+vw-8){var xl=r.left+sx-w-12;x=xl>=sx+8?xl:(sx+vw-w-8)}
    var y=r.top+sy;
    if(y+h>sy+document.documentElement.clientHeight-8)y=Math.max(sy+52,r.bottom+sy-h);
    pin.style.left=x+'px';pin.style.top=y+'px';
  }
  document.addEventListener('click',function(e){
    if(!on())return;
    var tgt=e.target.closest?e.target.closest('[data-note]'):null;
    if(tgt){
      var r=tgt.getBoundingClientRect();
      if(e.clientX>r.right-24&&e.clientY<r.top+22){
        e.stopPropagation();e.preventDefault();
        var pin=document.getElementById('proto-pin-'+tgt.getAttribute('data-note'));
        if(pin){
          if(pin.classList.contains('pn-open')){pin.classList.remove('pn-open')}
          else{pin.classList.add('pn-open');place(tgt,pin)}
        }
      }
    }
  },true);
  document.addEventListener('click',function(e){
    var t=e.target;
    var fab=t.closest?t.closest('.pn-fab'):null;
    if(fab){toggle();return}
    var pc=t.closest?t.closest('.proto-pin'):null;
    if(pc){
      if(t.classList&&t.classList.contains('pnp-close'))pc.classList.remove('pn-open');
      return;
    }
  });
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply);else apply();
})();
</script>
</body>
</html>
