<body>

  <div class="m-header">
    <div class="m-hd-title">我的</div>
    <div class="m-hd-sub">移动端 · 企业微信 H5</div>
  </div>

  <div class="m-body">
    <div class="m-hero">
      <div class="m-hero-top">
        <div class="m-avatar" id="m-avatar"></div>
        <div>
          <div class="m-me-name" id="m-me-name">—</div>
          <span class="m-me-role" id="m-me-role">—</span>
        </div>
      </div>
    </div>

    <div class="m-jump-stats">
      <div class="m-jump-stat" onclick="go('待办审批.html')">
        <div class="m-js-hd">待办指标<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
        <div class="m-js-row"><b id="m-st-todo">—</b><span>待审核</span></div>
        <div class="m-js-row"><b id="m-st-done">—</b><span>已处理</span></div>
      </div>
      <div class="m-jump-stat" onclick="go('库存查询.html')">
        <div class="m-js-hd">库存指标<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></div>
        <div class="m-js-row"><b id="m-st-sku">—</b><span>物料种类</span></div>
        <div class="m-js-row"><b id="m-st-instk">—</b><span>在库种类</span></div>
      </div>
    </div>

    <div class="m-sec-title">个人信息</div>
    <div class="m-cell-group">
      <div class="m-cell"><span class="m-cell-key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>姓名</span><span class="m-cell-val" id="m-pi-name">—</span></div>
      <div class="m-cell"><span class="m-cell-key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.58 2.81.7A2 2 0 0 1 22 16.92z"/></svg>手机号</span><span class="m-cell-val" id="m-pi-phone">—</span></div>
      <div class="m-cell"><span class="m-cell-key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="9" r="2.5"/><path d="M8 17a4 4 0 0 1 8 0"/></svg>角色</span><span class="m-cell-val" id="m-pi-role">—</span></div>
      <div class="m-cell"><span class="m-cell-key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>数据范围</span><span class="m-cell-val" id="m-pi-scope">—</span></div>
    </div>

    <div class="m-sec-title">企微绑定</div>
    <div class="m-cell-group">
      <div class="m-cell"><span class="m-cell-key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>企业微信</span><span class="m-cell-val">已绑定 · 消息点开即审</span></div>
    </div>

    <button class="m-btn m-btn-danger" id="m-btn-logout" style="margin-top:14px;">退出登录</button>
  </div>

  <div class="m-tabbar">
    <a href="待办审批.html"><span class="m-tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-4"/></svg></span>待办</a>
    <a href="库存查询.html"><span class="m-tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>库存</a>
    <a href="我的.html" class="active"><span class="m-tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>我的</a>
  </div>

</div>
<script src="../_data/demo-data.js"></script>
<script src="_m.js"></script>
<script>
/* ---- 我的：性别通用头像 + 待办/库存指标卡（点击跳对应页）+ 个人信息（users 实体取手机号/数据范围）+ 企微绑定；信息少不设二级页（道远 09-18） ---- */
(function () {
  var u = mUser() || { name: '沈婷', role: '商务主管' };

  /* 头像：按性别取两版低饱和通用头像（男=蓝灰剪影 · 女=灰粉剪影带发环） */
  var GENDER = { '沈婷': 'f', '李婧': 'f', '江强': 'm', '陈锋': 'm' };
  var AVATARS = {
    m: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#e9eef5"/><circle cx="32" cy="25" r="8.5" fill="#93a9c6"/><path d="M15.5 56a16.5 16.5 0 0 1 33 0z" fill="#93a9c6"/></svg>',
    f: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#f1ecef"/><path fill-rule="evenodd" d="M32 14.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21zM32 18a7 7 0 1 1 0 14 7 7 0 0 1 0-14z" fill="#b49aa8"/><circle cx="32" cy="25" r="7" fill="#e6d8de"/><path d="M15.5 56a16.5 16.5 0 0 1 33 0z" fill="#b49aa8"/></svg>'
  };
  document.getElementById('m-avatar').innerHTML = AVATARS[GENDER[u.name] || 'f'];

  /* 角色名从 roles 实体校验取数（同既有口径） */
  var roleName = u.role;
  mRows('roles').forEach(function (r) {
    if (r.row.fields && r.row.fields.name === u.role) roleName = r.row.fields.name;
  });
  document.getElementById('m-me-name').textContent = u.name;
  document.getElementById('m-me-role').textContent = roleName;

  /* 待办指标：待审核=todoItems 待审核行数 / 已处理=本机已审计数 */
  var done = mDoneMap();
  var nTodo = 0;
  mRows('todoItems').forEach(function (r) {
    if ((done[r.id] || r.row.fields.action) === '待审核') nTodo++;
  });
  document.getElementById('m-st-todo').textContent = nTodo;
  document.getElementById('m-st-done').textContent = Object.keys(done).length;

  /* 库存指标：物料种类/在库种类（与库存查询页同口径：stockFlows 有状态行） */
  var nSku = 0, nIn = 0;
  mRows('stockFlows').forEach(function (r) {
    if (!r.row.fields || !r.row.fields.status) return;
    nSku++; if (r.row.fields.status === '在库') nIn++;
  });
  document.getElementById('m-st-sku').textContent = nSku;
  document.getElementById('m-st-instk').textContent = nIn;

  /* 个人信息：手机号/数据范围取 users 实体（按姓名匹配，掩码号） */
  var uc = null;
  mRows('users').forEach(function (r) {
    var c = r.row.cells || [];
    if (c[0] === u.name) uc = c;
  });
  document.getElementById('m-pi-name').textContent = u.name;
  document.getElementById('m-pi-phone').textContent = uc ? uc[3] : '—';
  document.getElementById('m-pi-role').textContent = roleName;
  document.getElementById('m-pi-scope').textContent = uc ? uc[2] : '—';

  document.getElementById('m-btn-logout').onclick = function () {
    mLogout();                                   // 清 m-auth / m-done
    mToast('已退出登录 · 下次访问需重新验证');
    setTimeout(function () { go('登录.html'); }, 600);
  };

  mGuard();   // 登录守卫：未登录跳 登录.html
})();
</script>
</body>
</html>
