<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>P3-R01-M02 · 待办审批</title>
<link rel="stylesheet" href="_m.css?v=20260920b">
</head>
<body>
<div class="m-page" id="m-app">

  <div class="m-header">
    <div class="m-hd-title">待办审批</div>
    <div class="m-hd-sub" id="m-hd-sub">—</div>
  </div>

  <div class="m-body">
    <div class="m-stat">
      <div class="m-stat-item" data-f="待审核" onclick="mPickStat(this)"><div class="m-stat-num is-danger" id="m-stat-todo">—</div><div class="m-stat-label">待审核</div></div>
      <div class="m-stat-item" data-f="其他" onclick="mPickStat(this)"><div class="m-stat-num" id="m-stat-other">—</div><div class="m-stat-label">待验收 / 待确认 / 待入库</div></div>
      <div class="m-stat-item" data-f="" onclick="mPickStat(this)"><div class="m-stat-num" id="m-stat-all">—</div><div class="m-stat-label">全部待办</div></div>
    </div>
    <div id="m-list"></div>
  </div>

  <div class="m-tabbar">
    <a href="待办审批.html" class="active"><span class="m-tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-4"/></svg></span>待办</a>
    <a href="库存查询.html"><span class="m-tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>库存</a>
    <a href="我的.html"><span class="m-tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>我的</a>
  </div>

</div>
<script src="../_data/demo-data.js"></script>
<script src="_m.js"></script>
<script>
/* ---- 待办审批：消费 DEMO_DATA.todoItems（20 行·D-151 后），统计卡点选下钻 + 卡片列表 ---- */
(function () {
  var u = mUser() || { name: '沈婷', role: '商务主管' };
  document.getElementById('m-hd-sub').textContent = u.name + ' · ' + u.role;

  var rows = mRows('todoItems');                 // [{id: 单号, row: {fields: {...}}}]
  var done = mDoneMap();                         // 本机已审结果回显 { 单号: 已通过|已驳回 }

  function actOf(r) { return done[r.id] || r.row.fields.action; }

  var nTodo = 0, nOther = 0;
  rows.forEach(function (r) {
    if (actOf(r) === '待审核') nTodo++; else nOther++;
  });
  document.getElementById('m-stat-todo').textContent = nTodo;
  document.getElementById('m-stat-other').textContent = nOther;
  document.getElementById('m-stat-all').textContent = rows.length;

  function mRender(f) {   // f='待审核'|'其他'|''=全部——统计卡下钻过滤
    var list = rows.filter(function (r) {
      if (!f) return true;
      return f === '待审核' ? actOf(r) === '待审核' : actOf(r) !== '待审核';
    });
    document.getElementById('m-list').innerHTML = list.map(function (r) {
      var fl = r.row.fields;
      var act = actOf(r);
      return '<div class="m-item" onclick="go(\'审批详情.html?id=' + encodeURIComponent(r.id) + '\')">'
        + '<div class="m-item-top"><span class="m-badge ' + mTypeCls(fl.type) + '">' + mEsc(fl.type) + '</span>'
        + '<span class="m-badge ' + mBadgeCls(act) + '">' + mEsc(act) + '</span></div>'
        + '<div class="m-item-doc">' + mEsc(fl.docNo) + '</div>'
        + '<div class="m-item-title">' + mEsc(fl.summary) + '</div>'
        + '<div class="m-item-meta"><span>审核人 ' + mEsc(fl.auditor) + '</span><span>提交 ' + mEsc(fl.submitter) + '</span><span>' + mEsc(fl.time) + '</span></div>'
        + '</div>';
    }).join('') || '<div class="m-empty">暂无待办事项</div>';
  }
  window.mRender = mRender;

  window.mPickStat = function (el) {   // 统计卡点选：再点同卡取消过滤（DOM 副作用就地切换）
    var f = el.getAttribute('data-f') || '';
    var already = el.classList.contains('active') && f !== '';
    document.querySelectorAll('.m-stat-item').forEach(function (s) { s.classList.remove('active'); });
    if (!already) { if (f !== '') el.classList.add('active'); mRender(f); }
    else mRender('');
  };

  mRender('');
  mGuard();   // 免二次登录守卫：未登录跳 登录.html
})();
</script>
</body>
</html>
